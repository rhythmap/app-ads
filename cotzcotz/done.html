<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メールアドレスの確認が完了しました｜CotzCotz（コツコツ）</title>
<meta name="robots" content="noindex">
<style>
  :root{--primary:#FF8FA3;--mint:#06D6A0;--text:#4A4A4A;--sub:#8E8B85;--bg:#FFFDF8;--card:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
  .wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:460px;background:var(--card);border-radius:18px;padding:36px 28px 26px;
    text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.07)}
  .badge{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;background:#E6FAF3;
    display:flex;align-items:center;justify-content:center}
  h1{font-size:21px;line-height:1.5;margin:0 0 12px;color:var(--text)}
  p{font-size:15px;line-height:1.85;margin:0}
  .steps{text-align:left;background:var(--bg);border-radius:12px;padding:16px 18px 16px 34px;margin:22px 0 0}
  .steps li{font-size:14.5px;line-height:1.95;color:#555}
  .sub{font-size:13.5px;color:var(--sub);line-height:1.85;margin-top:16px;text-align:left}
  .footer{margin-top:28px;padding-top:18px;border-top:1px solid #eee;font-size:12.5px;color:#999;line-height:1.9}
  a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="21" fill="#06D6A0" opacity=".16"/>
          <path d="M15 24.5l6.5 6.5L33 19" stroke="#06D6A0" stroke-width="4.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1>メールアドレスの確認が<br>完了しました</h1>
      <p>ありがとうございます。<br>このページを閉じて、<b>CotzCotz アプリに戻ってください。</b></p>

      <ol class="steps">
        <li>この画面を閉じます</li>
        <li>CotzCotz を開きます</li>
        <li>ホームのお知らせが消えていれば完了です</li>
      </ol>

      <p class="sub">
        お知らせがまだ出ている場合は、アプリを一度閉じてから開き直してください。
        それでも消えないときは、ホームのお知らせにある「再送」からもう一度お試しいただけます。
      </p>

      <div class="footer">
        CotzCotz（コツコツ）— コツコツ、わたしを積み上げる<br>
        <a href="/cotzcotz/lp/">アプリの紹介ページ</a> ・
        <a href="mailto:rhythmap.net@gmail.com">お問い合わせ</a>
      </div>
    </main>
  </div>
</body>
</html>
