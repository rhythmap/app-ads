<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --coral: #FF8FA3;
      --mint: #06D6A0;
      --blue: #4EA8DE;
      --grape: #9B5DE5;
      --ink: #4a4a4a;
      --sub: #8c867e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 85px;
      overflow: hidden;
      position: relative;
    }
    
    .bg-sky {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('file:///Users/Yuji.Ishimura/Develop/git/app-ads/cotz_bg.jpg') no-repeat center center;
      background-size: cover;
      z-index: 1;
    }
    .bg-hill {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 350px;
      background: url('file:///Users/Yuji.Ishimura/Develop/git/app-ads/cotz_hill.png') no-repeat center bottom;
      background-size: 100% 100%;
      z-index: 2;
    }
    
    .hero {
      text-align: center;
      z-index: 10;
      position: relative;
    }
    
    .hero h1 {
      font-size: 82px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 2px;
    }
    
    .hero h1 .line1 {
      color: var(--ink);
      display: block;
      margin-bottom: 10px;
    }
    
    .hero h1 .line2 {
      display: block;
    }
    
    .hero h1 .c1 { color: var(--coral); }
    .hero h1 .c2 { color: var(--mint); }
    .hero h1 .c3 { color: var(--blue); }
    .hero h1 .c4 { color: var(--grape); }

    .hero p {
      font-size: 28px;
      color: var(--sub);
      margin-top: 35px;
      font-weight: 500;
      letter-spacing: 1px;
      white-space: nowrap; 
    }

    /* SVG Map Path */
    .map-path {
      position: absolute; bottom: 80px; left: 0; width: 100%; height: 200px; z-index: 3;
    }

    .characters {
      position: absolute;
      bottom: 80px;
      left: 0;
      width: 100%;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 40px;
      z-index: 5;
    }

    .char-img {
      height: 180px; /* Increased size significantly */
      width: auto;
      object-fit: contain;
    }

    .cotz-container {
      width: 115px;
      height: 115px;
      margin-bottom: -5px;
    }

    .map-pin {
      position: absolute;
      font-size: 40px;
      z-index: 4;
      text-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .pin1 { bottom: 180px; left: 150px; }
    .pin2 { bottom: 220px; right: 200px; }
    
    .tree {
      position: absolute;
      z-index: 4;
      height: 100px;
    }
    .tree1 { bottom: 150px; left: 50px; }
    .tree2 { bottom: 130px; right: 80px; height: 120px; }
    .tree3 { bottom: 220px; left: 250px; height: 80px; }

  </style>
</head>
<body>
    <div class="bg-sky"></div>
    <div class="bg-hill"></div>

    <!-- Map Path -->
    <svg class="map-path" viewBox="0 0 1200 200" preserveAspectRatio="none">
      <path d="M-50,150 Q200,200 400,100 T800,100 T1250,50" 
            fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="25, 20" opacity="0.8" />
    </svg>

    <!-- Map Elements -->
    <div class="map-pin pin1">📍</div>
    <div class="map-pin pin2">🚩</div>
    <img src="file:///Users/Yuji.Ishimura/Develop/git/app-ads/cotz_tree.png" class="tree tree1">
    <img src="file:///Users/Yuji.Ishimura/Develop/git/app-ads/cotz_tree.png" class="tree tree2">
    <img src="file:///Users/Yuji.Ishimura/Develop/git/app-ads/cotz_tree.png" class="tree tree3">

    <div class="hero">
      <h1>
        <span class="line1">日常に、</span>
        <span class="line2">
          <span class="c1">ちょっ</span><span class="c2">とした</span><span class="c3">リズム</span><span class="c4">を。</span>
        </span>
      </h1>
      <p>RHYTHMAPは、毎日を少し豊かにする、明るくてやさしいアプリを作っています。</p>
    </div>

    <!-- Reusable Cotz SVG Definition -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="cotz" viewBox="0 0 100 100">
      <ellipse cx="50" cy="92" rx="26" ry="4" fill="#000" opacity="0.10"/>
      <rect x="38" y="9" width="26" height="22" rx="7" fill="#06D6A0"/><rect x="41" y="12" width="9" height="5" rx="2.5" fill="#fff" opacity="0.55"/>
      <rect x="21" y="29" width="58" height="54" rx="17" fill="currentColor"/><rect x="26" y="34" width="16" height="7" rx="3.5" fill="#fff" opacity="0.45"/>
      <circle cx="40" cy="53" r="5.4" fill="#fff"/><circle cx="60" cy="53" r="5.4" fill="#fff"/><circle cx="41.5" cy="54" r="2.6" fill="#4A4A4A"/><circle cx="61.5" cy="54" r="2.6" fill="#4A4A4A"/>
      <circle cx="31" cy="63" r="4" fill="#ff5d7a" opacity="0.45"/><circle cx="69" cy="63" r="4" fill="#ff5d7a" opacity="0.45"/>
      <path d="M42 65 Q50 73 58 65" stroke="#4A4A4A" stroke-width="3" fill="none" stroke-linecap="round"/>
      <rect x="31" y="81" width="13" height="8" rx="4" fill="currentColor" opacity="0.85"/><rect x="56" y="81" width="13" height="8" rx="4" fill="currentColor" opacity="0.85"/>
    </symbol></svg>

    <div class="characters">
      <img src="file:///Users/Yuji.Ishimura/Develop/git/app-ads/ohapet1.png" class="char-img">
      <div class="cotz-container">
        <svg viewBox="0 0 100 100" style="width: 100%; height: 100%;"><use href="#cotz" style="color: #FF8FA3"/></svg>
      </div>
      <img src="file:///Users/Yuji.Ishimura/Develop/git/app-ads/ohapet2.png" class="char-img">
      <div class="cotz-container">
        <svg viewBox="0 0 100 100" style="width: 100%; height: 100%;"><use href="#cotz" style="color: #4EA8DE"/></svg>
      </div>
      <img src="file:///Users/Yuji.Ishimura/Develop/git/app-ads/ohapet3.png" class="char-img">
    </div>
</body>
</html>
