<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --coral: #FF8FA3;
      --mint: #06D6A0;
      --blue: #4EA8DE;
      --grape: #9B5DE5;
      --ink: #4a4a4a;
      --sub: #8c867e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      font-family: 'Zen Kaku Gothic New', sans-serif;
      color: var(--ink);
      /* Use the generated background image */
      background: url('/Users/Yuji.Ishimura/.gemini/antigravity/brain/5634b671-ce92-449f-a92f-b060ecf99e89/rhythmap_ogp_bg_1786168314465.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 70px; /* Position text in the upper half */
      overflow: hidden;
    }
    
    .hero {
      text-align: center;
    }
    
    .hero h1 {
      font-size: 82px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 2px;
    }
    
    .hero h1 .line1 {
      color: var(--ink);
      display: block;
      margin-bottom: 10px;
    }
    
    .hero h1 .line2 {
      display: block;
    }
    
    .hero h1 .c1 { color: var(--coral); }
    .hero h1 .c2 { color: var(--mint); }
    .hero h1 .c3 { color: var(--blue); }
    .hero h1 .c4 { color: var(--grape); }

    .hero p {
      font-size: 28px;
      color: var(--sub);
      margin-top: 35px;
      font-weight: 500;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
    <div class="hero">
      <h1>
        <span class="line1">日常に、</span>
        <span class="line2">
          <span class="c1">ちょっ</span><span class="c2">とした</span><span class="c3">リズム</span><span class="c4">を。</span>
        </span>
      </h1>
      <p>RHYTHMAPは、毎日を少し豊かにする、明るくてやさしいアプリを作っています。</p>
    </div>
</body>
</html>
