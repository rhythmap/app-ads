<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OhaPet</title>
<meta name="robots" content="noindex">
<style>
  :root{--primary:#FFAB91;--primary-lt:#FFCCBC;--mint:#4DB6AC;--text:#5D4037;--sub:#8D6E63;
        --bg:#FFFDF5;--bg2:#FFF3E0;--card:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;color:var(--text);-webkit-text-size-adjust:100%;
    background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
      "Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans KR","Noto Sans SC","Noto Sans TC",sans-serif}
  .wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:460px;background:var(--card);border-radius:22px;padding:36px 28px 26px;
    text-align:center;box-shadow:0 10px 30px rgba(255,171,145,.22)}
  .badge{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;background:#E4F5F2;
    display:flex;align-items:center;justify-content:center}
  h1{font-size:21px;line-height:1.5;margin:0 0 12px}
  .lead{font-size:15px;line-height:1.85;margin:0}
  .steps{text-align:left;background:var(--bg);border-radius:14px;padding:16px 18px 16px 36px;margin:22px 0 0}
  .steps li{font-size:14.5px;line-height:1.95;color:var(--text)}
  .sub{font-size:13.5px;color:var(--sub);line-height:1.85;margin-top:16px;text-align:left}
  .footer{margin-top:28px;padding-top:18px;border-top:1px solid #F1E7E0;font-size:12.5px;
    color:var(--sub);line-height:1.9}
  a{color:#E5795A;text-decoration:none}a:hover{text-decoration:underline}
  b{font-weight:700}
</style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="21" fill="#4DB6AC" opacity=".16"/>
          <path d="M15 24.5l6.5 6.5L33 19" stroke="#4DB6AC" stroke-width="4.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
      <ol class="steps" id="steps"></ol>
      <p class="sub" id="sub"></p>
      <div class="footer">
        <span id="brand"></span><br>
        <a id="lpLink" href="/ohapet/lp/"></a> ・
        <a id="mailLink" href="mailto:rhythmap.net@gmail.com"></a>
      </div>
    </main>
  </div>

<script>
/* おはようペットは多言語アプリ。アプリ側が continue URL に ?lang=xx を付けて渡すので
   それを最優先し、無ければブラウザの言語、それも駄目なら英語にする。
   （英語のまま放置すると、そもそもこのページを作った意味がなくなる） */
var T = {
  ja: { app:'おはようペット',
    h1:'メールアドレスの確認が<br>完了しました',
    lead:'ありがとうございます。<br>このページを閉じて、<b>おはようペット</b> に戻ってください。',
    steps:['この画面を閉じます','おはようペット を開きます','アカウント画面のお知らせが消えていれば完了です'],
    sub:'お知らせがまだ出ている場合は、アプリを一度閉じてから開き直してください。それでも消えないときは、アカウント画面の「確認メールを再送」からもう一度お試しいただけます。',
    lp:'アプリの紹介ページ', mail:'お問い合わせ' },
  en: { app:'OhaPet',
    h1:'Your email address<br>has been verified',
    lead:'Thank you.<br>You can close this page and return to <b>OhaPet</b>.',
    steps:['Close this page','Open OhaPet','The notice on the Account screen should be gone'],
    sub:'If the notice is still showing, close the app completely and open it again. If it still does not clear, tap “Resend verification email” on the Account screen.',
    lp:'About the app', mail:'Contact us' },
  de: { app:'OhaPet',
    h1:'Ihre E-Mail-Adresse<br>wurde bestätigt',
    lead:'Vielen Dank.<br>Sie können diese Seite schließen und zu <b>OhaPet</b> zurückkehren.',
    steps:['Diese Seite schließen','OhaPet öffnen','Der Hinweis im Kontobereich sollte verschwunden sein'],
    sub:'Wird der Hinweis weiterhin angezeigt, schließen Sie die App vollständig und öffnen Sie sie erneut. Hilft das nicht, tippen Sie im Kontobereich auf „Bestätigungs-E-Mail erneut senden“.',
    lp:'Über die App', mail:'Kontakt' },
  es: { app:'OhaPet',
    h1:'Tu correo electrónico<br>ha sido verificado',
    lead:'Gracias.<br>Puedes cerrar esta página y volver a <b>OhaPet</b>.',
    steps:['Cierra esta página','Abre OhaPet','El aviso de la pantalla de cuenta debería haber desaparecido'],
    sub:'Si el aviso sigue apareciendo, cierra la aplicación por completo y vuelve a abrirla. Si aun así no desaparece, pulsa «Reenviar correo de verificación» en la pantalla de cuenta.',
    lp:'Sobre la app', mail:'Contacto' },
  fr: { app:'OhaMoko',
    h1:'Votre adresse e-mail<br>a été vérifiée',
    lead:'Merci.<br>Vous pouvez fermer cette page et revenir à <b>OhaMoko</b>.',
    steps:['Fermez cette page','Ouvrez OhaMoko','Le message sur l’écran Compte devrait avoir disparu'],
    sub:'Si le message est toujours affiché, fermez complètement l’application puis rouvrez-la. Si cela ne suffit pas, appuyez sur « Renvoyer l’e-mail de vérification » dans l’écran Compte.',
    lp:'À propos de l’app', mail:'Nous contacter' },
  ko: { app:'OhaPet',
    h1:'이메일 주소 확인이<br>완료되었습니다',
    lead:'감사합니다.<br>이 페이지를 닫고 <b>OhaPet</b> 으로 돌아가 주세요.',
    steps:['이 화면을 닫습니다','OhaPet 을 엽니다','계정 화면의 안내가 사라졌으면 완료입니다'],
    sub:'안내가 계속 표시되면 앱을 완전히 종료했다가 다시 열어 주세요. 그래도 사라지지 않으면 계정 화면의 「확인 메일 재전송」을 눌러 주세요.',
    lp:'앱 소개', mail:'문의하기' },
  zh: { app:'早安萌宠',
    h1:'邮箱地址验证完成',
    lead:'感谢您的确认。<br>请关闭此页面，返回 <b>早安萌宠</b>。',
    steps:['关闭此页面','打开早安萌宠','账户页面的提示消失即表示完成'],
    sub:'如果提示仍然显示，请先完全关闭应用再重新打开。若仍未消失，可在账户页面点击「重新发送验证邮件」。',
    lp:'应用介绍', mail:'联系我们' },
  'zh-TW': { app:'OhaPet',
    h1:'電子郵件地址<br>驗證完成',
    lead:'感謝您的確認。<br>請關閉此頁面，返回 <b>OhaPet</b>。',
    steps:['關閉此頁面','開啟 OhaPet','帳戶頁面的提示消失即表示完成'],
    sub:'若提示仍然顯示，請先完全關閉應用程式再重新開啟。若仍未消失，可在帳戶頁面點選「重新傳送驗證郵件」。',
    lp:'應用程式介紹', mail:'聯絡我們' }
};

function pick() {
  var q = (new URLSearchParams(location.search).get('lang') || '').trim();
  var cands = [q, navigator.language || '', (navigator.languages || [])[0] || ''];
  for (var i = 0; i < cands.length; i++) {
    var raw = cands[i]; if (!raw) continue;
    var tag = raw.replace('_', '-');
    var low = tag.toLowerCase();
    // 中国語だけは簡体/繁体で文面が違うので、地域・字体まで見る
    if (low.indexOf('zh') === 0) {
      if (/hant|-tw|-hk|-mo/.test(low)) return ['zh-TW', 'zh-Hant'];
      return ['zh', 'zh-Hans'];
    }
    var base = low.split('-')[0];
    if (T[base]) return [base, base];
  }
  return ['en', 'en'];
}

var r = pick(), t = T[r[0]];
document.documentElement.lang = r[1];
document.title = t.app;
document.getElementById('h1').innerHTML = t.h1;
document.getElementById('lead').innerHTML = t.lead;
document.getElementById('steps').innerHTML = t.steps.map(function (s) {
  return '<li>' + s + '</li>';
}).join('');
document.getElementById('sub').textContent = t.sub;
document.getElementById('brand').textContent = t.app + ' — RHYTHMAP';
document.getElementById('lpLink').textContent = t.lp;
document.getElementById('mailLink').textContent = t.mail;
</script>
</body>
</html>
