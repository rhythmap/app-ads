<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OhaPet</title>
<meta name="robots" content="noindex">
<style>
  :root{--primary:#FFAB91;--primary-lt:#FFCCBC;--mint:#4DB6AC;--text:#5D4037;--sub:#8D6E63;
        --bg:#FFFDF5;--bg2:#FFF3E0;--card:#FFFFFF}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;color:var(--text);-webkit-text-size-adjust:100%;
    background:linear-gradient(135deg,var(--bg) 0%,var(--bg2) 100%);background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,
      "Hiragino Kaku Gothic ProN",Meiryo,"Noto Sans KR","Noto Sans SC","Noto Sans TC",sans-serif}
  .wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:460px;background:var(--card);border-radius:22px;padding:36px 28px 26px;
    text-align:center;box-shadow:0 10px 30px rgba(255,171,145,.22)}
  .badge{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;background:#FFEDE4;
    display:flex;align-items:center;justify-content:center}
  h1{font-size:21px;line-height:1.5;margin:0 0 12px}
  .lead{font-size:15px;line-height:1.85;margin:0}
  .steps{text-align:left;background:var(--bg);border-radius:14px;padding:16px 18px 16px 36px;margin:22px 0 0}
  .steps li{font-size:14.5px;line-height:1.95;color:var(--text)}
  .sub{font-size:13.5px;color:var(--sub);line-height:1.85;margin-top:16px;text-align:left}
  .footer{margin-top:28px;padding-top:18px;border-top:1px solid #F1E7E0;font-size:12.5px;
    color:var(--sub);line-height:1.9}
  a{color:#E5795A;text-decoration:none}a:hover{text-decoration:underline}
  b{font-weight:700}
</style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
          <rect x="12" y="21" width="24" height="17" rx="5" fill="#FFAB91" opacity=".22"/>
          <path d="M18 21v-4a6 6 0 0 1 12 0v4" stroke="#E5795A" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="12" y="21" width="24" height="17" rx="5" stroke="#E5795A" stroke-width="3.4"/>
          <circle cx="24" cy="29.5" r="2.4" fill="#E5795A"/>
        </svg>
      </div>
      <h1 id="h1"></h1>
      <p class="lead" id="lead"></p>
      <ol class="steps" id="steps"></ol>
      <p class="sub" id="sub"></p>
      <div class="footer">
        <span id="brand"></span><br>
        <a id="lpLink" href="/ohapet/lp/"></a> ・
        <a id="mailLink" href="mailto:rhythmap.net@gmail.com"></a>
      </div>
    </main>
  </div>

<script>
/* おはようペットは多言語アプリ。アプリ側が continue URL に ?lang=xx を付けて渡すので
   それを最優先し、無ければブラウザの言語、それも駄目なら英語にする。
   （英語のまま放置すると、そもそもこのページを作った意味がなくなる） */
var T = {
  ja: { app:'おはようペット',
    h1:'パスワードの変更が<br>完了しました',
    lead:'新しいパスワードが設定されました。<br>このページを閉じて、<b>おはようペット</b> に戻ってください。',
    steps:['この画面を閉じます','おはようペット を開きます','新しいパスワードでログインします'],
    sub:'すでにログイン中の端末では、そのままお使いいただけます。心当たりのない変更だった場合は、下のお問い合わせからご連絡ください。',
    lp:'アプリの紹介ページ', mail:'お問い合わせ' },
  en: { app:'OhaPet',
    h1:'Your password<br>has been changed',
    lead:'Your new password has been set.<br>You can close this page and return to <b>OhaPet</b>.',
    steps:['Close this page','Open OhaPet','Sign in with your new password'],
    sub:'Devices where you are already signed in can keep going as they are. If you did not request this change, please contact us below.',
    lp:'About the app', mail:'Contact us' },
  de: { app:'OhaPet',
    h1:'Ihr Passwort<br>wurde geändert',
    lead:'Ihr neues Passwort wurde gespeichert.<br>Sie können diese Seite schließen und zu <b>OhaPet</b> zurückkehren.',
    steps:['Diese Seite schließen','OhaPet öffnen','Mit dem neuen Passwort anmelden'],
    sub:'Auf bereits angemeldeten Geräten können Sie einfach weitermachen. Falls Sie diese Änderung nicht angefordert haben, kontaktieren Sie uns bitte unten.',
    lp:'Über die App', mail:'Kontakt' },
  es: { app:'OhaPet',
    h1:'Tu contraseña<br>ha sido cambiada',
    lead:'Tu nueva contraseña se ha guardado.<br>Puedes cerrar esta página y volver a <b>OhaPet</b>.',
    steps:['Cierra esta página','Abre OhaPet','Inicia sesión con tu nueva contraseña'],
    sub:'En los dispositivos donde ya has iniciado sesión puedes seguir usando la app con normalidad. Si no solicitaste este cambio, escríbenos abajo.',
    lp:'Sobre la app', mail:'Contacto' },
  fr: { app:'OhaMoko',
    h1:'Votre mot de passe<br>a été modifié',
    lead:'Votre nouveau mot de passe a été enregistré.<br>Vous pouvez fermer cette page et revenir à <b>OhaMoko</b>.',
    steps:['Fermez cette page','Ouvrez OhaMoko','Connectez-vous avec votre nouveau mot de passe'],
    sub:'Sur les appareils déjà connectés, vous pouvez continuer normalement. Si vous n’êtes pas à l’origine de ce changement, contactez-nous ci-dessous.',
    lp:'À propos de l’app', mail:'Nous contacter' },
  ko: { app:'OhaPet',
    h1:'비밀번호 변경이<br>완료되었습니다',
    lead:'새 비밀번호가 설정되었습니다.<br>이 페이지를 닫고 <b>OhaPet</b> 으로 돌아가 주세요.',
    steps:['이 화면을 닫습니다','OhaPet 을 엽니다','새 비밀번호로 로그인합니다'],
    sub:'이미 로그인되어 있는 기기에서는 그대로 사용하실 수 있습니다. 본인이 요청한 변경이 아니라면 아래 문의처로 연락해 주세요.',
    lp:'앱 소개', mail:'문의하기' },
  zh: { app:'早安萌宠',
    h1:'密码修改完成',
    lead:'新密码已设置。<br>请关闭此页面，返回 <b>早安萌宠</b>。',
    steps:['关闭此页面','打开早安萌宠','使用新密码登录'],
    sub:'已登录的设备可以继续正常使用。如果这不是您本人的操作，请通过下方联系我们。',
    lp:'应用介绍', mail:'联系我们' },
  'zh-TW': { app:'OhaPet',
    h1:'密碼變更完成',
    lead:'新密碼已設定。<br>請關閉此頁面，返回 <b>OhaPet</b>。',
    steps:['關閉此頁面','開啟 OhaPet','使用新密碼登入'],
    sub:'已登入的裝置可以繼續正常使用。如果這不是您本人的操作，請透過下方聯絡我們。',
    lp:'應用程式介紹', mail:'聯絡我們' }
};

function pick() {
  var q = (new URLSearchParams(location.search).get('lang') || '').trim();
  var cands = [q, navigator.language || '', (navigator.languages || [])[0] || ''];
  for (var i = 0; i < cands.length; i++) {
    var raw = cands[i]; if (!raw) continue;
    var tag = raw.replace('_', '-');
    var low = tag.toLowerCase();
    // 中国語だけは簡体/繁体で文面が違うので、地域・字体まで見る
    if (low.indexOf('zh') === 0) {
      if (/hant|-tw|-hk|-mo/.test(low)) return ['zh-TW', 'zh-Hant'];
      return ['zh', 'zh-Hans'];
    }
    var base = low.split('-')[0];
    if (T[base]) return [base, base];
  }
  return ['en', 'en'];
}

var r = pick(), t = T[r[0]];
document.documentElement.lang = r[1];
document.title = t.app;
document.getElementById('h1').innerHTML = t.h1;
document.getElementById('lead').innerHTML = t.lead;
document.getElementById('steps').innerHTML = t.steps.map(function (s) {
  return '<li>' + s + '</li>';
}).join('');
document.getElementById('sub').textContent = t.sub;
document.getElementById('brand').textContent = t.app + ' — RHYTHMAP';
document.getElementById('lpLink').textContent = t.lp;
document.getElementById('mailLink').textContent = t.mail;
</script>
</body>
</html>
